[project]
name = "bandstack"
version = "0.1.0"
description = "Bandstack of environmental predictors for the Flemish Region (TerraTwin Belgian use case)"
readme = "README.md"
authors = [
    { name = "jfilipovic", email = "jovana.filipovic@ilvo.vlaanderen.be" }
]
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
